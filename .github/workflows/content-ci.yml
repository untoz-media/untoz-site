name: Untoz Content CI

on:
  pull_request:
    branches: [main]
    paths-ignore:
      - 'backend/**'
      - '.github/workflows/command-api-ci.yml'
  push:
    branches: [main]
    paths-ignore:
      - 'backend/**'
      - '.github/workflows/command-api-ci.yml'
  workflow_dispatch:

env:
  PUBLIC_SITE_BASE: https://untoz-media.github.io/untoz-site

permissions:
  contents: read

concurrency:
  group: untoz-content-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Validate CMS
        run: npm run validate:content

      - name: Production build
        run: npm run build

      - name: Summary
        if: always()
        run: |
          echo "## Untoz Content CI" >> "$GITHUB_STEP_SUMMARY"
          echo "CMS validation and production build completed for $GITHUB_SHA." >> "$GITHUB_STEP_SUMMARY"

  browser-qa:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Install Chromium QA runtime
        run: |
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Build production preview
        run: npm run build

      - name: Start production preview
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/untoz-preview.log 2>&1 &
          echo $! > /tmp/untoz-preview.pid
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then
              echo 'Untoz production preview is ready.'
              exit 0
            fi
            sleep 1
          done
          cat /tmp/untoz-preview.log
          exit 1

      - name: Run browser QA
        env:
          UNTOZ_QA_BASE_URL: http://127.0.0.1:4173/
          UNTOZ_QA_OUT: qa-artifacts
        run: node scripts/browser-qa.mjs

      - name: Run Command V2 admin QA
        env:
          UNTOZ_QA_BASE_URL: http://127.0.0.1:4173/
          UNTOZ_QA_OUT: qa-artifacts
        run: node scripts/admin-shell-qa.mjs

      - name: Show preview log on failure
        if: failure()
        run: cat /tmp/untoz-preview.log || true

      - name: Upload browser QA report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: untoz-v2-browser-qa
          path: qa-artifacts/
          if-no-files-found: warn
          retention-days: 14

      - name: Browser QA summary
        if: always()
        run: |
          echo "## Untoz Browser QA" >> "$GITHUB_STEP_SUMMARY"
          echo "Chromium checks cover the production dist in FHD, QHD, 4K, tablet, mobile, selected dark-mode routes and the authenticated Command V2 shell." >> "$GITHUB_STEP_SUMMARY"
