name: Untoz Browser QA

on:
  pull_request:
    paths:
      - '**/*.html'
      - '**/*.css'
      - '**/*.js'
      - '**/*.json'
      - 'scripts/**'
      - '.github/workflows/browser-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install project dependencies
        run: npm ci

      - name: Install browser QA runtime
        run: |
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Start Vite preview server
        run: |
          npm run dev -- --host 127.0.0.1 --port 4173 > /tmp/untoz-vite.log 2>&1 &
          echo $! > /tmp/untoz-vite.pid
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then
              echo 'Untoz preview is ready.'
              exit 0
            fi
            sleep 1
          done
          cat /tmp/untoz-vite.log
          exit 1

      - name: Run browser QA
        env:
          UNTOZ_QA_BASE_URL: http://127.0.0.1:4173/
          UNTOZ_QA_OUT: qa-artifacts
        run: node scripts/browser-qa.mjs

      - name: Show Vite log on failure
        if: failure()
        run: cat /tmp/untoz-vite.log || true

      - name: Upload QA screenshots and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: untoz-v2-browser-qa
          path: qa-artifacts/
          if-no-files-found: warn
          retention-days: 14
