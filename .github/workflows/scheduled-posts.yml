name: Publish scheduled posts

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: untoz-scheduled-posts
  cancel-in-progress: false

jobs:
  publish-due-posts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check scheduled queue
        id: scheduler
        run: node scripts/publish-scheduled-posts.mjs

      - name: Commit published posts
        if: steps.scheduler.outputs.changed == 'true'
        run: |
          git config user.name "Untoz Scheduler"
          git config user.email "untoz-scheduler@users.noreply.github.com"
          git add content/posts.json
          git commit -m "Publish scheduled post(s)"
          git push origin HEAD:main

      - name: Job summary
        if: always()
        run: |
          echo "## Untoz Scheduled Posts" >> "$GITHUB_STEP_SUMMARY"
          echo "Published: ${{ steps.scheduler.outputs.count || '0' }}" >> "$GITHUB_STEP_SUMMARY"
          if [ -n "${{ steps.scheduler.outputs.posts }}" ]; then
            echo "Posts: ${{ steps.scheduler.outputs.posts }}" >> "$GITHUB_STEP_SUMMARY"
          fi
